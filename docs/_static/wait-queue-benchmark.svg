<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="540" viewBox="0 0 1080 540" role="img" aria-labelledby="title desc">
  <title id="title">FCFS with EASY backfilling: mean end-to-end runtime relative to deque</title>
  <desc id="desc">A diverging horizontal bar chart. Circular uses about 0.68 times deque's time. Multimap and the Python reference use about 16 times deque's time.</desc>
  <style>.title{font:600 20px sans-serif;fill:#243746}.subtitle{font:13px sans-serif;fill:#52636f}.label{font:14px sans-serif;fill:#243746}.value{font:13px sans-serif;fill:#243746}.tick{font:12px sans-serif;fill:#52636f}.grid{stroke:#d9e2e8;stroke-width:1}.baseline{stroke:#52636f;stroke-width:2}</style>
  <rect width="1080" height="540" fill="#fff"/>
  <text x="38" y="35" class="title">FCFS/EASY end-to-end runtime relative to deque</text>
  <text x="38" y="57" class="subtitle">Mean of 10 runs; bar length is log₂(runtime / deque). Exact times and standard deviations are in the table.</text>
  <g class="grid"><line x1="365" y1="95" x2="365" y2="475"/><line x1="595" y1="95" x2="595" y2="475"/><line x1="710" y1="95" x2="710" y2="475"/><line x1="825" y1="95" x2="825" y2="475"/><line x1="940" y1="95" x2="940" y2="475"/></g><line x1="480" y1="85" x2="480" y2="475" class="baseline"/>
  <g class="tick"><text x="365" y="84" text-anchor="middle">0.5×</text><text x="480" y="75" text-anchor="middle">1× deque</text><text x="595" y="84" text-anchor="middle">2×</text><text x="710" y="84" text-anchor="middle">4×</text><text x="825" y="84" text-anchor="middle">8×</text><text x="940" y="84" text-anchor="middle">16×</text></g>
  <g><text x="38" y="119" class="label">Circular</text><rect x="417" y="104" width="63" height="20" rx="3" fill="#8fd3a1"/><text x="407" y="119" text-anchor="end" class="value">0.68×</text>
  <text x="38" y="154" class="label">Block-16</text><rect x="433" y="139" width="47" height="20" rx="3" fill="#9ec5e5"/><text x="423" y="154" text-anchor="end" class="value">0.75×</text>
  <text x="38" y="189" class="label">Block-8</text><rect x="441" y="174" width="39" height="20" rx="3" fill="#9ec5e5"/><text x="431" y="189" text-anchor="end" class="value">0.79×</text>
  <text x="38" y="224" class="label">Block-32</text><rect x="445" y="209" width="35" height="20" rx="3" fill="#9ec5e5"/><text x="435" y="224" text-anchor="end" class="value">0.81×</text>
  <text x="38" y="259" class="label">Block-64</text><rect x="451" y="244" width="29" height="20" rx="3" fill="#9ec5e5"/><text x="441" y="259" text-anchor="end" class="value">0.84×</text>
  <text x="38" y="294" class="label">Block-128</text><rect x="460" y="279" width="20" height="20" rx="3" fill="#9ec5e5"/><text x="450" y="294" text-anchor="end" class="value">0.89×</text>
  <text x="38" y="329" class="label">Block-4</text><rect x="464" y="314" width="16" height="20" rx="3" fill="#9ec5e5"/><text x="454" y="329" text-anchor="end" class="value">0.91×</text>
  <text x="38" y="364" class="label">Block-256</text><rect x="466" y="349" width="14" height="20" rx="3" fill="#9ec5e5"/><text x="456" y="364" text-anchor="end" class="value">0.92×</text>
  <text x="38" y="399" class="label">Deque</text><circle cx="480" cy="394" r="7" fill="#607d8b"/><text x="492" y="399" class="value">1.00×</text>
  <text x="38" y="434" class="label">Multimap</text><rect x="480" y="419" width="457" height="20" rx="3" fill="#e8aa85"/><text x="947" y="434" class="value">15.71×</text>
  <text x="38" y="469" class="label">Python reference</text><rect x="480" y="454" width="460" height="20" rx="3" fill="#e7a7c5"/><text x="950" y="469" class="value">15.96×</text></g>
  <text x="38" y="512" class="subtitle">Lower is better. Circular and every block size are left of the deque baseline.</text>
</svg>
