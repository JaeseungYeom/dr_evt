services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${DR_EVT_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  server:
    build:
      # The repository root is the build context; Dockerfiles are organized
      # by role beneath this Compose file.
      context: ../..
      dockerfile: containers/docker/server/Dockerfile
    image: dr-evt-server:local
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${DR_EVT_PORT:-50051}:50051"
    volumes:
      # Simulation outputs written in /data persist in this host directory.
      - type: bind
        source: ${DR_EVT_RESULTS_DIR:-../../results}
        target: /data
      # Streaming initialization validates the input CSV header server-side.
      - type: bind
        source: ${DR_EVT_DATA_DIR:-../../data}
        target: /input
        read_only: true

  client:
    build:
      context: ../..
      dockerfile: containers/docker/client/Dockerfile
    image: dr-evt-client:local
    depends_on:
      - server
    stdin_open: true
    tty: true
    working_dir: /input
    volumes:
      # The same /input path is visible to the server for header validation.
      - type: bind
        source: ${DR_EVT_DATA_DIR:-../../data}
        target: /input
        read_only: true

volumes:
  redis-data:
